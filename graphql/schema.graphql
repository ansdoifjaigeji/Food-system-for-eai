type User {
    id: ID!
    name: String!
    email: String!
    avatar: String
    dark_mode: Boolean
    role: String
    created_at: String
    updated_at: String

    
    restaurants: [Restaurant!]! @hasMany
}

type Restaurant {
    id: ID!
    user_id: ID!
    name: String!
    description: String
    address: String
    phone: String
    is_active: Boolean!
    created_at: String
    updated_at: String
    
    
    foodAndBeverages: [FoodAndBeverage!]! @hasMany

    
    user: User! @belongsTo
}

type FoodAndBeverage {
    id: ID!
    restaurant_id: ID!
    name: String!
    description: String
    price: Float!
    category: String
    is_available: Boolean!
    created_at: String
    updated_at: String
    
    
    restaurant: Restaurant! @belongsTo
}

type Query {
    
    # USER QUERIES
    
    "View all users within the system"
    allUsers: [User!]! @all

    "View a single user by their ID"
    user(id: ID! @eq): User @find

    
    # RESTAURANT QUERIES
    
    "View all restaurants"
    allRestaurants: [Restaurant!]! @all

    "View a single restaurant by its ID"
    restaurant(id: ID! @eq): Restaurant @find

    
    # FOOD & BEVERAGE QUERIES

    "View all food & beverage menu items"
    allFoodAndBeverages: [FoodAndBeverage!]! @all

    "View a single food & beverage item by its ID"
    foodAndBeverage(id: ID! @eq): FoodAndBeverage @find
}

type Mutation {
    
    # USER MUTATIONS
    
    "Create a new user"
    createUser(
        name: String!
        email: String!
        password: String!
        avatar: String
        dark_mode: Boolean = false
        role: String = "merchant"
    ): User! @create

    "Update an existing user's details"
    updateUser(
        id: ID!
        name: String
        email: String
        password: String
        avatar: String
        dark_mode: Boolean
        role: String
    ): User! @update

    "Delete a user from the system"
    deleteUser(id: ID! @eq): User @delete

    
    # RESTAURANT MUTATIONS 
    
    "Create a new restaurant"
    createRestaurant(
        user_id: ID!
        name: String!
        description: String
        address: String
        phone: String
        is_active: Boolean = true
    ): Restaurant! @create

    "Update an existing restaurant"
    updateRestaurant(
        id: ID!
        user_id: ID
        name: String
        description: String
        address: String
        phone: String
        is_active: Boolean
    ): Restaurant! @update

    "Delete a restaurant"
    deleteRestaurant(id: ID! @eq): Restaurant @delete

    
    # FOOD & BEVERAGE MUTATIONS
    
    "Create a new food or beverage item"
    createFoodAndBeverage(
        restaurant_id: ID!
        name: String!
        description: String
        price: Float!
        category: String
        is_available: Boolean = true
    ): FoodAndBeverage! @create

    "Update an existing food or beverage item"
    updateFoodAndBeverage(
        id: ID!
        restaurant_id: ID
        name: String
        description: String
        price: Float
        category: String
        is_available: Boolean
    ): FoodAndBeverage! @update

    "Delete a food or beverage item"
    deleteFoodAndBeverage(id: ID! @eq): FoodAndBeverage @delete
}